name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install coverage

      - name: Run unit tests with coverage
        run: |
          coverage run --source=aviationstack_mcp -m unittest discover -s tests -v
          coverage report --fail-under=95

      - name: Verify the MCP server card matches the server
        run: |
          python scripts/generate_server_card.py --check
